# ============================================================================
# collie-waker — bjw-s common library chart values
# ============================================================================
# Required at install time (override via -f or --set):
#   waker.publicHost, ssh.host, ssh.user, wol.macAddress
#
# Defaults here match the HelmRelease in jonmast/k8s-conf
# (apps/collie-waker/release.yaml) so that release only overrides, never fights,
# the chart.
# ============================================================================

# -- Waker HTTP handler behaviour.
waker:
  # -- Public host Collie validates against. Sent as the Host header when the
  #    waker polls Collie, and the target of the 307 redirect.
  publicHost: ""        # required
  # -- Where the waker polls Collie. The tunnel now lives in its own pod, so
  #    this goes through that pod's Service rather than a local forward.
  pollUrl: 'http://{{ include "bjw-s.common.lib.chart.names.fullname" . }}-tunnel:{{ .Values.service.tunnel.ports.tunnel.port }}/api/snapshot'
  # -- Give up waking after this long, then serve a 503 auto-reload page.
  timeoutSeconds: 45
  # -- After Collie answers, wait one Traefik health-check interval so the
  #    failover has flipped back to the primary before issuing the 307.
  healthIntervalSeconds: 5
  # -- At most one magic packet per this many seconds.
  wolRateLimitSeconds: 10
  # -- Delay between polls of Collie while waiting for it to come up.
  pollIntervalMs: 1000
  listenPort: 8080

# -- Wake-on-LAN target.
wol:
  macAddress: ""        # required, XX:XX:XX:XX:XX:XX
  broadcastAddr: 255.255.255.255
  port: 9

# -- SSH tunnel to the dev box. Collie binds 127.0.0.1:8787 there, so the
#    cluster reaches it only through this tunnel.
ssh:
  host: ""              # required
  user: ""              # required
  port: 22
  # -- Bind the forward on the pod interface, not the pod loopback, so Traefik's
  #    primary upstream and health check reach it via the Service.
  tunnelBindAddr: 0.0.0.0
  tunnelLocalPort: 8787
  collieServerPort: 8787
  # -- Name of an existing Secret holding `ssh-privatekey` and `known_hosts`.
  existingSecret: ""
  # -- HOME for the `ssh` client inside the pod. Backed by an emptyDir (the root
  #    filesystem is read-only) and used as the base for `mountPath` below, so no
  #    dev-box username is baked into the chart. Override both together if you
  #    point `mountPath` somewhere else.
  homeDir: /home/collie
  mountPath: "{{ .Values.ssh.homeDir }}/.ssh"
  strictHostKeyChecking: accept-new

# -- Container image. Users override these with --set, no deep nesting needed.
image:
  repository: ghcr.io/jonmast/collie-waker
  # -- Image tag. May include @sha256:... digest. Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

# ============================================================================
# bjw-s common library chart — https://bjw-s-labs.github.io/helm-charts
# ============================================================================

global:
  # -- (string) Override the chart name used in resource names.
  nameOverride: ""
  # -- (string) Override the fullname used in resource names.
  fullnameOverride: ""
  labels: {}

defaultPodOptions:
  # NOTE: hostNetwork is deliberately NOT set here. It is set on the waker
  # controller alone (see controllers.main below), because sharing the node's
  # network namespace publishes every port the pod binds on every interface of
  # the node. The tunnel is unrestricted access to Collie — effectively a root
  # shell — so it stays in an ordinary pod, reachable only via its Service.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  imagePullSecrets: []

controllers:
  # -- The waker: Traefik's fallback. Runs with hostNetwork so the magic packet
  #    actually reaches the LAN, and therefore binds :8080 on the node — keep
  #    this side free of anything that grants access to Collie.
  main:
    type: deployment
    replicas: 1
    strategy: Recreate

    pod:
      annotations: {}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

    containers:
      main:
        image:
          repository: "{{ .Values.image.repository }}"
          tag: "{{ .Values.image.tag | default .Chart.AppVersion }}"
          pullPolicy: IfNotPresent

        securityContext: &containerSecurity
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
              - ALL

        ports:
          - name: http
            containerPort: 8080
            protocol: TCP

        env:
          ROLE: waker

        envFrom:
          - configMapRef:
              identifier: env

        # Liveness only, deliberately no readiness: a failing readiness probe
        # withdraws the endpoint, and an unreachable fallback means Traefik has
        # nowhere to send traffic while the dev box is asleep — exactly when the
        # waker is needed.
        probes: &probes
          liveness:
            enabled: true
            type: HTTP
            path: /healthz
            port: http
            spec:
              initialDelaySeconds: 5
              periodSeconds: 15
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: false
          startup:
            enabled: false

        resources: &resources
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi

  # -- The tunnel: Traefik's primary upstream. An ordinary pod, so the forward
  #    to Collie is confined to the cluster network and reachable only through
  #    its Service. This is the whole reason the two halves are separate.
  tunnel:
    type: deployment
    replicas: 1
    strategy: Recreate

    pod:
      annotations: {}

    containers:
      main:
        image:
          repository: "{{ .Values.image.repository }}"
          tag: "{{ .Values.image.tag | default .Chart.AppVersion }}"
          pullPolicy: IfNotPresent

        securityContext: *containerSecurity

        ports:
          - name: tunnel
            containerPort: 8787
            protocol: TCP
          - name: http
            containerPort: 8080
            protocol: TCP

        env:
          ROLE: tunnel

        envFrom:
          - configMapRef:
              identifier: env

        probes: *probes

        resources: *resources

service:
  # Traefik's fallback.
  main:
    controller: main
    primary: true
    type: ClusterIP
    ports:
      http:
        port: 8080
        primary: true
        protocol: TCP

  # Traefik's primary upstream, and what the waker polls while waking the box.
  tunnel:
    controller: tunnel
    type: ClusterIP
    ports:
      tunnel:
        port: 8787
        primary: true
        protocol: TCP

configMaps:
  env:
    data:
      PORT: "{{ .Values.waker.listenPort }}"
      PUBLIC_HOST: "{{ required `waker.publicHost is required` .Values.waker.publicHost }}"
      POLL_URL: "{{ tpl .Values.waker.pollUrl . }}"
      TIMEOUT_SECONDS: "{{ .Values.waker.timeoutSeconds }}"
      HEALTH_INTERVAL_SECONDS: "{{ .Values.waker.healthIntervalSeconds }}"
      WOL_RATE_LIMIT_SECONDS: "{{ .Values.waker.wolRateLimitSeconds }}"
      POLL_INTERVAL_MS: "{{ .Values.waker.pollIntervalMs }}"
      WOL_MAC_ADDRESS: "{{ required `wol.macAddress is required` .Values.wol.macAddress }}"
      WOL_BROADCAST_ADDR: "{{ .Values.wol.broadcastAddr }}"
      WOL_PORT: "{{ .Values.wol.port }}"
      SSH_HOST: "{{ required `ssh.host is required` .Values.ssh.host }}"
      SSH_USER: "{{ required `ssh.user is required` .Values.ssh.user }}"
      SSH_PORT: "{{ .Values.ssh.port }}"
      HOME: "{{ .Values.ssh.homeDir }}"
      SSH_MOUNT_PATH: "{{ tpl .Values.ssh.mountPath . }}"
      SSH_KEY_PATH: "{{ printf `%s/ssh-privatekey` (tpl .Values.ssh.mountPath .) }}"
      SSH_KNOWN_HOSTS_PATH: "{{ printf `%s/known_hosts` (tpl .Values.ssh.mountPath .) }}"
      SSH_STRICT_HOST_KEY_CHECKING: "{{ .Values.ssh.strictHostKeyChecking }}"
      TUNNEL_BIND_ADDR: "{{ .Values.ssh.tunnelBindAddr }}"
      TUNNEL_LOCAL_PORT: "{{ .Values.ssh.tunnelLocalPort }}"
      COLLIE_SERVER_PORT: "{{ .Values.ssh.collieServerPort }}"
      RUST_LOG: "info"

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  # HOME for the ssh client. Only the tunnel role runs ssh.
  home:
    type: emptyDir
    advancedMounts:
      tunnel:
        main:
          - path: "{{ .Values.ssh.homeDir }}"
  # The private key is mounted into the tunnel pod alone. The waker has no use
  # for it and should not be able to reach the dev box if it is ever exploited
  # through its node-exposed port.
  ssh-key:
    enabled: false
    type: secret
    name: "{{ .Values.ssh.existingSecret }}"
    defaultMode: 384
    advancedMounts:
      tunnel:
        main:
          # Not `.Values.ssh.mountPath`: the common chart templates this field
          # only once, so a value that is itself a template would land here
          # unrendered.
          - path: "{{ .Values.ssh.homeDir }}/.ssh"
            readOnly: true

serviceAccount:
  main:
    annotations: {}
